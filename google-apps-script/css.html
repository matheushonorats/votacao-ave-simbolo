<style>
/* ============================================================
   DESIGN SYSTEM — VOTAÇÃO AVE SÍMBOLO (FESTIVAL ENTRE ASAS)
   Paleta: Tons naturais de Mata Atlântica e Litoral (Sem tons roxos)
   ============================================================ */

:root {
  --font-serif: 'Cinzel', serif;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Cores Principais */
  --color-primary: #0e2a38;        /* Azul Mar Profundo / Noturno */
  --color-primary-light: #1b4353;
  --color-accent: #2d6a4f;         /* Verde Floresta / Mata Atlântica */
  --color-accent-hover: #1b4332;
  --color-gold: #c67d0a;           /* Ouro Queimado / Âmbar */
  --color-gold-light: #fef8ee;
  --color-sand: #f8f6f0;           /* Areia Clara / Linho */
  
  /* Superfícies & Bordas */
  --color-bg: #f5f4ef;
  --color-surface: #ffffff;
  --color-surface-hover: #faf9f6;
  --color-border: #e6e2d8;
  --color-border-hover: #c4beaf;
  
  /* Textos */
  --color-text-main: #182228;
  --color-text-muted: #5c6870;
  --color-text-light: #88959e;

  /* Estados */
  --color-success: #1b4332;
  --color-success-bg: #edf7f2;
  --color-error: #b91c1c;
  --color-error-bg: #fef2f2;

  /* Efeitos */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 2px 6px rgba(14, 42, 56, 0.04);
  --shadow-md: 0 8px 24px rgba(14, 42, 56, 0.08);
  --shadow-lg: 0 16px 48px rgba(14, 42, 56, 0.12);
  --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── Reset & Base ────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: var(--font-sans);
  background-color: var(--color-bg);
  color: var(--color-text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ── Top Bar ─────────────────────────────────────────────── */
.top-bar {
  background-color: var(--color-primary);
  color: rgba(255, 255, 255, 0.85);
  font-size: 0.8125rem;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.top-bar__content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.badge-status {
  display: inline-flex;
  align-items: center;
  background-color: var(--color-accent);
  color: #ffffff;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.top-bar__info {
  letter-spacing: 0.02em;
}

/* ── Hero Header ─────────────────────────────────────────── */
.hero {
  background: linear-gradient(180deg, #ffffff 0%, var(--color-sand) 100%);
  padding: 48px 0 40px;
  text-align: center;
  border-bottom: 1px solid var(--color-border);
}

.hero__container {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 860px;
}

.hero__brand {
  margin-bottom: 24px;
}

.hero__logo {
  max-width: 320px;
  height: auto;
  display: block;
}

.hero__title {
  font-family: var(--font-serif);
  font-size: 2.25rem;
  font-weight: 700;
  color: var(--color-primary);
  line-height: 1.25;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

.hero__subtitle {
  font-size: 1.0625rem;
  color: var(--color-text-muted);
  max-width: 720px;
  margin-bottom: 20px;
}

.hero__rules-badge {
  display: inline-block;
  background: #ffffff;
  border: 1px solid var(--color-border);
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-primary);
  box-shadow: var(--shadow-sm);
}

/* ── Section Headers ─────────────────────────────────────── */
.main-content {
  padding: 48px 24px 80px;
}

.section-header {
  text-align: center;
  margin-bottom: 36px;
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1.75rem;
  color: var(--color-primary);
  margin-bottom: 8px;
}

.section-subtitle {
  font-size: 0.9375rem;
  color: var(--color-text-muted);
}

/* ── Birds Grid ──────────────────────────────────────────── */
.birds-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-bottom: 56px;
}

@media (max-width: 992px) {
  .birds-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
}

@media (max-width: 640px) {
  .birds-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .hero__title {
    font-size: 1.75rem;
  }
  .hero__logo {
    max-width: 240px;
  }
}

/* ── Bird Card ───────────────────────────────────────────── */
.bird-card {
  background: var(--color-surface);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  position: relative;
}

.bird-card:hover {
  transform: translateY(-5px);
  border-color: var(--color-border-hover);
  box-shadow: var(--shadow-md);
}

.bird-card.is-selected {
  border-color: var(--color-accent);
  background: #fbfdfc;
  box-shadow: 0 0 0 2px var(--color-accent), var(--shadow-md);
}

.bird-card__media {
  position: relative;
  width: 100%;
  height: 240px;
  overflow: hidden;
  background-color: #e9ecef;
}

.bird-card__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.bird-card:hover .bird-card__img {
  transform: scale(1.04);
}

.bird-card__tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(14, 42, 56, 0.82);
  backdrop-filter: blur(6px);
  color: #ffffff;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.02em;
}

.bird-card__selected-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: var(--color-accent);
  color: #ffffff;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 4px;
  display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.bird-card.is-selected .bird-card__selected-badge {
  display: block;
}

.bird-card__body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.bird-card__title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  color: var(--color-primary);
  line-height: 1.3;
  margin-bottom: 4px;
}

.bird-card__scientific {
  font-size: 0.875rem;
  font-style: italic;
  color: var(--color-text-muted);
  margin-bottom: 12px;
}

.bird-card__excerpt {
  font-size: 0.9rem;
  color: var(--color-text-muted);
  line-height: 1.5;
  margin-bottom: 20px;
  flex-grow: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.bird-card__actions {
  display: flex;
  gap: 10px;
  margin-top: auto;
}

.bird-card__btn-info {
  flex: 1;
  background: var(--color-sand);
  color: var(--color-primary);
  border: 1px solid var(--color-border);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}

.bird-card__btn-info:hover {
  background: #e9e5dc;
  color: var(--color-primary-light);
}

.bird-card__btn-vote {
  flex: 1.2;
  background: var(--color-primary);
  color: #ffffff;
  border: 1px solid transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}

.bird-card__btn-vote:hover {
  background: var(--color-primary-light);
}

.bird-card.is-selected .bird-card__btn-vote {
  background: var(--color-accent);
  border-color: var(--color-accent-hover);
}

/* ── Voting Card Section ─────────────────────────────────── */
.voting-section {
  max-width: 680px;
  margin: 0 auto;
}

.voting-card {
  background: var(--color-surface);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 32px;
  box-shadow: var(--shadow-sm);
}

.voting-card__header {
  margin-bottom: 24px;
  text-align: center;
}

.voting-card__title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  color: var(--color-primary);
  margin-bottom: 6px;
}

.voting-card__desc {
  font-size: 0.9375rem;
  color: var(--color-text-muted);
}

/* ── Selected Bird Preview ───────────────────────────────── */
.selected-bird-preview {
  background: var(--color-sand);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 24px;
  transition: var(--transition);
}

.selected-bird-preview__empty {
  text-align: center;
  color: var(--color-text-muted);
  font-size: 0.875rem;
  padding: 8px 0;
}

.selected-bird-item {
  display: flex;
  align-items: center;
  gap: 16px;
}

.selected-bird-item__img {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  border: 1px solid var(--color-border);
}

.selected-bird-item__info {
  flex-grow: 1;
}

.selected-bird-item__title {
  font-family: var(--font-serif);
  font-size: 1.0625rem;
  color: var(--color-primary);
  font-weight: 600;
}

.selected-bird-item__sub {
  font-size: 0.8125rem;
  font-style: italic;
  color: var(--color-text-muted);
}

.selected-bird-item__tag {
  font-size: 0.75rem;
  background: var(--color-accent);
  color: #ffffff;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  display: inline-block;
  margin-top: 4px;
}

/* ── Form Controls ───────────────────────────────────────── */
.form-group {
  margin-bottom: 24px;
}

.form-label {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-primary);
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-family: var(--font-sans);
  color: var(--color-text-main);
  background: #ffffff;
  transition: var(--transition);
  outline: none;
}

.form-input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
}

.form-input.is-invalid {
  border-color: var(--color-error);
}

.form-helper {
  display: block;
  font-size: 0.78125rem;
  color: var(--color-text-muted);
  margin-top: 6px;
}

.form-error {
  font-size: 0.8125rem;
  color: var(--color-error);
  margin-top: 6px;
  display: none;
  font-weight: 500;
}

.form-error.is-visible {
  display: block;
}

.form-actions {
  margin-top: 28px;
}

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 28px;
  border-radius: var(--radius-sm);
  font-size: 0.9375rem;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
  text-decoration: none;
}

.btn-primary {
  width: 100%;
  background-color: var(--color-accent);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover:not(:disabled) {
  background-color: var(--color-accent-hover);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.btn-primary:disabled {
  background-color: #bdc3c7;
  cursor: not-allowed;
  opacity: 0.8;
  transform: none;
  box-shadow: none;
}

.btn-secondary {
  background-color: var(--color-sand);
  color: var(--color-primary);
  border-color: var(--color-border);
}

.btn-secondary:hover {
  background-color: #e9e5dc;
}

.spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-left: 8px;
}

.is-loading .spinner {
  display: inline-block;
}

.is-loading .btn-text {
  opacity: 0.8;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Modals ──────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(14, 42, 56, 0.7);
  backdrop-filter: blur(6px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.is-open {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: var(--shadow-lg);
  transform: translateY(20px) scale(0.97);
  transition: var(--transition);
}

.modal-overlay.is-open .modal-card {
  transform: translateY(0) scale(1);
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(14, 42, 56, 0.6);
  color: #ffffff;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: var(--transition);
}

.modal-close:hover {
  background: rgba(14, 42, 56, 0.9);
}

.modal-media {
  position: relative;
  width: 100%;
  height: 280px;
  background-color: #2c3e50;
}

.modal-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-badge {
  position: absolute;
  bottom: 14px;
  left: 14px;
  background: rgba(14, 42, 56, 0.85);
  backdrop-filter: blur(4px);
  color: #ffffff;
  font-size: 0.8125rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 4px;
}

.modal-body {
  padding: 28px;
}

.modal-header {
  margin-bottom: 20px;
}

.modal-title {
  font-family: var(--font-serif);
  font-size: 1.625rem;
  color: var(--color-primary);
  margin-bottom: 4px;
}

.modal-scientific {
  font-size: 0.9375rem;
  font-style: italic;
  color: var(--color-text-muted);
}

.modal-section-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.modal-description {
  font-size: 0.9375rem;
  color: var(--color-text-main);
  line-height: 1.7;
}

.modal-description p {
  margin-bottom: 12px;
}

.modal-footer {
  display: flex;
  gap: 12px;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--color-border);
}

.modal-footer .btn {
  flex: 1;
}

/* ── Success Modal ───────────────────────────────────────── */
.modal-card--success {
  max-width: 480px;
  text-align: center;
  padding: 40px 32px;
}

.success-icon-wrap {
  width: 64px;
  height: 64px;
  background: var(--color-success-bg);
  color: var(--color-accent);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}

.success-icon {
  width: 32px;
  height: 32px;
}

.success-title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  color: var(--color-primary);
  margin-bottom: 12px;
}

.success-message {
  font-size: 0.9375rem;
  color: var(--color-text-muted);
  margin-bottom: 20px;
}

.success-bird-card {
  background: var(--color-sand);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 20px;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--color-primary);
}

.success-subtext {
  font-size: 0.8125rem;
  color: var(--color-text-muted);
  margin-bottom: 24px;
}

/* ── Toast Notifications ─────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1100;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--color-primary);
  color: #ffffff;
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  max-width: 380px;
  pointer-events: auto;
  animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  border-left: 4px solid var(--color-accent);
}

.toast--error {
  border-left-color: var(--color-error);
}

.toast--success {
  border-left-color: var(--color-accent);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Footer ──────────────────────────────────────────────── */
.footer {
  background-color: var(--color-primary);
  color: rgba(255, 255, 255, 0.7);
  padding: 36px 0;
  text-align: center;
  font-size: 0.875rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.footer__meta {
  font-size: 0.8125rem;
  margin-top: 6px;
  color: rgba(255, 255, 255, 0.5);
}

</style>
